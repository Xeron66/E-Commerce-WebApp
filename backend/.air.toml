root = "."
tmp_dir = "tmp"

[build]
  poll = true
  poll_interval = 500
  # This points to your new main.go location
  cmd = "go build -o ./tmp/main ./cmd/api/main.go"
  
  # The binary to execute after building
  bin = "./tmp/main"
  
  # Watch these file extensions for changes
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  
  # Ignore these directories
  exclude_dir = ["assets", "tmp", "vendor", "migrations"]
  
  # Delay in milliseconds before triggering a build
  delay = 1000
  
  stop_on_error = true
  send_interrupt = false
  kill_delay = 500

[log]
  time = false